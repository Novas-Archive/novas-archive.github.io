
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14251e">

<title>Nova's Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Italianno&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --green: #14251e;
  --green-light: #20372c;
  --cream: #f1ecdf;
  --gold: #b9a47c;
  --muted: #aaa997;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: var(--green);
  color: var(--cream);
  font-family: 'Cormorant Garamond', serif;
  display: flex;
  flex-direction: column;
}

header {
  padding: 30px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--gold);
  text-transform: uppercase;
}

.header-note {
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 70px 20px 100px;
}

.hero {
  width: 100%;
  max-width: 1050px;
  text-align: center;
  position: relative;
}

.ornament {
  color: var(--gold);
  font-size: 22px;
  margin-bottom: 30px;
  opacity: .85;
}

.pre-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 15px;
}

h1 {
  font-size: clamp(75px, 12vw, 145px);
  font-weight: 400;
  line-height: .85;
  letter-spacing: -4px;
}

h1 .first {
  display: block;
}

h1 .second {
  display: block;
  font-family: 'Italianno', cursive;
  font-size: 1.35em;
  color: var(--gold);
  font-weight: 400;
  letter-spacing: 0;
  margin-top: -4px;
}

.divider {
  width: 150px;
  height: 1px;
  background: var(--gold);
  margin: 42px auto 30px;
  position: relative;
}

.divider::after {
  content: "✦";
  position: absolute;
  background: var(--green);
  padding: 0 12px;
  color: var(--gold);
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
}

.description {
  max-width: 410px;
  margin: auto;
  color: #c3c0b2;
  font-size: 21px;
  line-height: 1.6;
  font-weight: 400;
}

.description em {
  color: var(--gold);
}

.signature {
  margin-top: 38px;
  font-family: 'Italianno', cursive;
  font-size: 34px;
  color: var(--gold);
}

footer {
  padding: 24px 7%;
  border-top: 1px solid rgba(185,164,124,.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

@media (max-width: 600px) {
  header {
    padding: 25px 6%;
  }

  .header-note {
    font-size: 8px;
    letter-spacing: 1px;
  }

  main {
    padding: 70px 20px;
  }

  h1 {
    font-size: clamp(65px, 17vw, 100px);
  }

  .description {
    font-size: 18px;
  }

  footer {
    gap: 15px;
    flex-wrap: wrap;
    font-size: 8px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">Novas Archive</div>
  <div class="header-note">An Independent Collection · Est. 2026</div>
</header>

<main>
  <section class="hero">

    <div class="ornament">❧</div>

    <div class="pre-title">
      A Repository of Imagined Worlds
    </div>

    <h1>
      <span class="first">Nova's</span>
      <span class="second">Archive</span>
    </h1>

    <div class="divider"></div>

    <p class="description">
      A quiet place for <em>worlds yet unwritten</em>,
      histories long remembered, and stories
      that deserve a place in eternity.
    </p>

    <div class="signature">
      — The Archive
    </div>

  </section>
</main>

<footer>
  <span>© Novas Archive</span>
  <span>Records · Worlds · Histories</span>
</footer>

</body>
</html>
